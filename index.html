.hist a{padding:10px 16px;font-size:14px;color:var(--ink);border-top:1px solid #EEF2F7;border-radius:0}.hist a:hover{background:#EAF1FB}
.hist a i{color:var(--mu);font-size:12.5px;min-width:46px}
.hist a:after{content:attr(title);margin-left:auto;padding-left:12px;font:11px ui-monospace,monospace;color:#94A3B8}
.tg{background:#fff;border:1px solid var(--ln);color:var(--ink);padding:12px 16px;border-radius:12px;margin:8px 0;font-size:13.5px}
.tgh{color:var(--ink);font-size:14px}.tgr{padding:6px 0;border-top:1px solid #EEF2F7}.tgr small{color:var(--mu);font-size:12px}.tg a{color:var(--ac);font-weight:600}
.cbx{position:fixed;z-index:60;background:#fff;border:1px solid #CBD5E1;border-radius:12px;box-shadow:0 14px 36px rgba(15,23,42,.2);max-height:280px;overflow:auto;padding:4px}
.cbx div{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600}.cbx small{display:block;font-weight:400;color:var(--mu);font-size:12px}.cbx .on,.cbx div:hover{background:#E4EDFA}
.pgr textarea{margin-top:6px;font-size:12.5px;line-height:1.5;height:220px;resize:vertical;background:#F8FAFC}
.sh{min-height:3.1em;line-height:1.55}.sg u{min-width:68%;padding-bottom:2px}
.isi.app{grid-template-columns:1fr!important}.isi .side,.isi .tabs{display:none}
.btn{white-space:nowrap}.tb{flex-wrap:wrap}.tb .grow{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(min-width:1101px) and (max-width:1320px){.app{grid-template-columns:260px 1fr!important}.split{grid-template-columns:360px 1fr}.paper{zoom:.74}}
.isi .split{grid-template-columns:430px 1fr}@media(max-width:1100px){.isi .split{grid-template-columns:1fr}}
@media(max-width:1100px){.app{grid-template-columns:1fr!important;height:auto}.work{height:auto}.split{grid-template-columns:1fr}.panel,.stage{overflow:visible}.paper{zoom:.6}}
@media print{.tabs,.view{display:none!important}.work,.split{display:block;height:auto}}

</style><style id="printfix">
/* ===== PERBAIKAN CETAK =====
   Penyebab form tercetak kecil & "terlalu lebar": saat mencetak, lebar halaman A4 (~700px)
   dianggap layar kecil oleh browser, sehingga aturan responsif @media(max-width:1100px/1180px)
   ikut aktif dan menerapkan zoom .6 pada .paper (form diperkecil jadi 60%).
   Blok ini sengaja diletakkan paling akhir supaya menimpa semua aturan layar tersebut. */
@media print{
@page{margin:12mm 14mm 16mm}
html,body{height:auto!important;overflow:visible!important;background:#fff!important}
.app,.work,.split,.stage{display:block!important;height:auto!important;min-height:0!important;overflow:visible!important}
.side,.panel,.tb,.tabs,.view,#toast,.mdl,.cbx{display:none!important}
.paper{zoom:1!important;transform:none!important;width:auto!important;max-width:none!important;margin:0!important;padding:0!important;box-shadow:none!important;border-radius:0!important;background:#fff!important}
.paper:before{display:none!important}

/* ukuran asli 100% butuh ruang vertikal lebih rapat agar form 1 halaman tetap muat */
.hbar{margin-bottom:10px}
.tt{margin:2px 0 4px}
.rule{margin-bottom:10px}
.ps{margin:11px 0 6px}
.ig{gap:6px 22px;margin-bottom:6px}
.sg{margin-top:12px}.sg>div{min-height:98px}
.gt{margin:4px 0 8px}
.gt th{padding:4px 7px;line-height:1.4}
/* sebelumnya "table.pg td{padding:0}" menimpa padding sel tabel sehingga teks menempel ke garis */
table.pg .gt td{padding:2px 7px;line-height:1.4}

/* tanda tangan tidak boleh sendirian di halaman baru */
.sg,.s4{break-before:avoid}
.kp{break-inside:avoid}
}
</style><style id="kop">
/* ===== KOP SURAT PT MURINDA SENTRA BAJA =====
   Dokumen bertanda kop: header (logo, alamat, QR) hanya di halaman pertama; pita footer + nomor halaman tampil di setiap
   halaman cetak lewat kotak margin @page (@bottom-center, lihat kopPage). Halaman 2 dst. diberi jarak atas 12mm lewat thead. */
.kopH,.kopF{display:block;max-width:none;height:auto}
.paper.kop{padding:0 17mm}
.paper.kop:before{display:none}
.paper.kop .kopH{width:calc(100% + 34mm);margin:0 -17mm}
.paper.kop .kopno{text-align:right;font:7pt/1.3 Inter,Arial,sans-serif;color:var(--mu);margin:2.5mm 0 4mm}
.paper.kop .kpad{height:0}
.paper.kop .kopFlow{width:calc(100% + 34mm);margin:14mm -17mm 0}
.isi #bk{display:none}
@media print{
.paper.kop{padding:0 17mm!important}
.paper.kop .kpad{height:12mm}
.paper.kop .kopH{margin-top:-12mm}
.paper.kop .kopFlow{display:none}
/* header kop ±51mm (lebih tinggi dari header biasa) → jarak vertikal dirapatkan agar surat 1 halaman tetap muat */
.paper.kop{font-size:9.2pt;line-height:1.5}
.paper.kop .kopno{margin:1.5mm 0 1mm}
.paper.kop .rule{margin-bottom:8px}
.paper.kop .t{margin:6px 0}
.paper.kop .sg{margin-top:10px}
.paper.kop .sg:not(.hasq)>div{min-height:84px}
.paper.kop .sg:not(.hasq) .sp{height:48px}
.paper.kop .ds{margin-top:8px}
}

const KRIT=[{"n": 1, "t": "Kehadiran kerja", "h": "Kehadiran kerja", "hrd": false, "lv": [{"l": "Baik", "d": "Tidak pernah mangkir / alpa dan hadir saat ada kerja lembur serta sangat jarang terlambat", "b": 1}, {"l": "Sedang", "d": "Mangkir / alpa maximal 1 hari dalam setahun, kadang-kadang terlambat masuk kerja", "b": 0.5}, {"l": "Kurang Baik", "d": "Mangkir / alpa lebih dari 1 hari tp kurang dari 5 hari dalam setahun, dan atau sering terlambat masuk kerja", "b": 0.25}, {"l": "Tidak Baik", "d": "Mangkir / alpa lebih dari 5 hari dalam setahun dan selalu datang terlambat", "b": 0}]}, {"n": 2, "t": "Perencanaan Kerja", "h": "Perencanaan Kerja", "hrd": false, "lv": [{"l": "Baik", "d": "Selalu Membuat renc kerja & / renc biaya dg cepat serta tingkat efisiensi & akurasi yang sangat baik.", "b": 3}, {"l": "Sedang", "d": "Membuat rencana kerja & / renc biaya, dgn hasil masih ditemukan terjadi kesalahan dalam pembuatan rencana kerja tersebut, penyerahan rencana kerja dilakukan setelah diminta", "b": 2}, {"l": "Kurang Baik", "d": "Membuat rencana kerja & / renc biaya jika diminta dgn waktu yang sudah sangat terlambat", "b": 1}, {"l": "Tidak Baik", "d": "Tidak membuat rencana kerja & / rencana biaya", "b": 0}]}, {"n": 3, "t": "Kepemimpinan", "h": "Kepemimpinan", "hrd": false, "lv": [{"l": "Baik", "d": "Mampu mengatur, mengembangkan kinerja bawahan dan dilaksanakan oleh bawahan dengan baik, tanpa support atasan", "b": 4}, {"l": "Sedang", "d": "Mampu mengatur bawahannya tanpa mendapatkan support atasannya, tapi masih terlihat kurang mendapatkan dukungan bawahan yang optimal.", "b": 2.5}, {"l": "Kurang Baik", "d": "Mampu mengatur bawahannya dengan baik tetapi harus mendapatkan support atasanya dan sering bawahan tidak mengikuti instruksi kerja", "b": 1}, {"l": "Tidak Baik", "d": "Tidak mampu mengatur bawahannya", "b": 0}]}, {"n": 4, "t": "Kontrol Pekerjaan", "h": "Kontrol Pekerjaan", "hrd": false, "lv": [{"l": "Baik", "d": "Selalu melakukan kontrol terhadap pekerjaan dg hasil selesai sebelum target (Schedule/Biaya < Rencana yang disetujui).", "b": 5}, {"l": "Sedang", "d": "Melakukan kontrol terhadap pekerjaan dg hasil rata2 selesai sesuai target (Schedule/Biaya < Rencana yang disetujui).", "b": 3}, {"l": "Kurang Baik", "d": "Melakukan kontrol apabila diminta oleh atasan & hasil tidak sesuai target ( Schedule / Biaya > Rencana yang disetujui)", "b": 0}, {"l": "Tidak Baik", "d": "Tidak melakukan kontrol atas pekerjaan yang menjadi tanggung jawabnya", "b": 0}]}, {"n": 5, "t": "Kejujuran", "h": "Kejujuran", "hrd": false, "lv": [{"l": "Baik", "d": "Selalu jujur dalam melaksanakan pekerjaan dan melakukan kontrol untuk menghindari kecurangan bawahan.", "b": 4}, {"l": "Sedang", "d": "Cukup jujur dalam melaksanakan pekerjaan tetapi tidak melakukan kontrol kejujuran bawahannya, sehingga bawahannya masih banyak yang berbuat tidak jujur", "b": 1}, {"l": "Kurang Baik", "d": "Kurang dapat dipercaya / tidak jujur serta tidak kontrol terhadap kejujuran bawahannya", "b": 0.5}, {"l": "Tidak Baik", "d": "Tidak dapat dipercaya", "b": 0}]}, {"n": 6, "t": "Pendelegasian", "h": "Pendelegasian", "hrd": false, "lv": [{"l": "Baik", "d": "Mampu mendelegasikan pekerjaan sehingga hasil dicapai sesuai dengan target", "b": 2}, {"l": "Sedang", "d": "Cukup mampu mendelegasikan pekerjaan kepada bawahan, tetapi sesekali harus mengerjakan sendiri", "b": 1}, {"l": "Kurang Baik", "d": "Kurang mampu mendelegasikan pekerjaan kepada bawahan dan sering mengerjakan pekerjaan yg seharusnya dikerjakan oleh bawahan", "b": 0.5}, {"l": "Tidak Baik", "d": "Tidak mampu mendelegasikan pekerjaan kepada bawahan, semua pekerjaan dikerjakan sendiri", "b": 0}]}, {"n": 7, "t": "Kerja sama Team", "h": "Kerja sama Team", "hrd": false, "lv": [{"l": "Baik", "d": "Mampu membentuk team yang baik dengan performa yang baik pula sehingga tidak terjadi mis komunikasi didalam team work nya.", "b": 1}, {"l": "Sedang", "d": "Team yang dibentuk cukup menghasilkan performa .", "b": 0.3}, {"l": "Kurang Baik", "d": "Team yang dibentuk kurang menghasilkan performa yang optimal sehingga masih sering terlihat bawahan melakukan mis komunikasi & tidak bekerja dengan kompak", "b": 0}, {"l": "Tidak Baik", "d": "Tidak dapat bekerja dalam team works", "b": 0}]}, {"n": 8, "t": "Tanggung Jawab", "h": "Tanggung Jawab", "hrd": false, "lv": [{"l": "Baik", "d": "Mampu menunjukkan tekat dan usaha yang keras untuk mencapai hasil yang terbaik", "b": 3}, {"l": "Sedang", "d": "Cukup ada kemauan dan usaha untuk mencapai hasil yang terbaik", "b": 2}, {"l": "Kurang Baik", "d": "Kadang terlihat santai, kurang dapat menghayati tugas dan tanggung jawab kurang ada usaha untuk memperbaiki dirinya sendiri", "b": 0.5}, {"l": "Tidak Baik", "d": "Sering terlihat santai, tidak dapat menghayati tugas dan tanggung jawab tidak ada usaha untuk memperbaiki dirinya sendiri", "b": 0}]}, {"n": 9, "t": "Inisiatif", "h": "Inisiatif", "hrd": false, "lv": [{"l": "Baik", "d": "Mampu mengatur dan menyelesaikan tugas-tugas yang yang menjadi tanggung jawab mampu mengembangkan alternatif tindakan tanpa harus diarahkan", "b": 2}, {"l": "Sedang", "d": "Cukup mampu mengatur dan menyelesaikan tugas-tugas yang yang menjadi tanggung jawab, cukup mampu mengembangkan alternatif tindakan tanpa harus diarahkan", "b": 1}, {"l": "Kurang Baik", "d": "Sering dapat bertindak sendiri sesuai tugas dan tanggungjawabnya", "b": 0.5}, {"l": "Tidak Baik", "d": "Lebih sering menunggu perintah walau ada kalanya dapat bertindak sendiri", "b": 0}]}, {"n": 10, "t": "Pengetahuan mengenai pekerjaan", "h": "Pengetahuan mengenai pekerjaan", "hrd": false, "lv": [{"l": "Baik", "d": "Tahu mendetail tentang pekerjaanya dan secara umum ahli dibidangnya", "b": 2}, {"l": "Sedang", "d": "Cukup tahu segi-segi pekerjaanya, hanya kadang perlu diberi bimbingan", "b": 1}, {"l": "Kurang Baik", "d": "Kurang memahami pekerjaanya dan masih memerlukan bimbingan", "b": 0.5}, {"l": "Tidak Baik", "d": "Tidak memahami pekerjaanya dan masih sering memerlukan bimbingan", "b": 0}]}, {"n": 11, "t": "Kualitas Pekerjaan", "h": "Kualitas Pekerjaan", "hrd": false, "lv": [{"l": "Baik", "d": "Secara konsisten hasil kerjanya baik dan memuaskan", "b": 2}, {"l": "Sedang", "d": "Hasil karyanya umumnya dapat dipertanggungjawabkan, tidak perlu sering dikoreksi", "b": 1}, {"l": "Kurang Baik", "d": "Hasil kerjanya kadang-kadang diperbaiki dan terkadang melakukan kesalahan / kurang teliti", "b": 0.5}, {"l": "Tidak Baik", "d": "Hasil kerjanya sering kali diperbaiki ulang dan sering melakukan kesalahan / kurang teliti", "b": 0}]}, {"n": 12, "t": "Kecepatan Kerja", "h": "Kecepatan Kerja", "hrd": false, "lv": [{"l": "Baik", "d": "Kecepatan kerja memuaskan, secara umum dapat memenuhi jadwal yang ditetapkan", "b": 1}, {"l": "Sedang", "d": "Pada umumnya kecepatan kerjanya cukup baik, lebih sering dapat memenuhi waktu yang diharapkan", "b": 0.5}, {"l": "Kurang Baik", "d": "Cenderung lamban dan masih ada pekerjaan yang tidak dapat diselesaikan sesuai jadwal", "b": 0.25}, {"l": "Tidak Baik", "d": "Sangat lamban dan masih banyak pekerjaan yang tidak dapat diselesaikan sesuai jadwal", "b": 0}]}];
const PASAL=[{"h": "PASAL 2: KEWAJIBAN PIHAK KEDUA", "it": [{"n": "1", "t": "berlaku. Pihak Kedua berkewajiban mematuhi tata tertib perusahaan dan peraturan perundang-undangan Republik Indonesia yang berlaku, mencakup namun tidak terbatas pada hal-hal sebagai berikut:", "sub": [{"n": "a", "t": "Hadir dan mulai bekerja tepat waktu, serta menyelesaikan tugas sesuai dengan jam kerja yang telah ditentukan. Apabila berhalangan hadir, Pihak Kedua wajib memberikan informasi kepada bagian HRD dan melampirkan surat keterangan"}, {"n": "b", "t": "yang sah (seperti surat keterangan dokter) pada hari pertama kembali bekerja. Merawat dan memelihara peralatan kerja, kendaraan, serta lingkungan kerja sebelum dan sesudah digunakan untuk"}, {"n": "c", "t": "memastikan kondisi tetap baik, bersih, dan aman demi keselamatan diri sendiri maupun orang lain. Menjaga nama baik dan martabat perusahaan, membina hubungan profesional yang baik dengan relasi, sesama karyawan,"}, {"n": "d", "t": "serta menjunjung tinggi nilai kemanusiaan dan moralitas. Berperan aktif dalam menciptakan lingkungan kerja yang harmonis dan kondusif antara sesama karyawan maupun"}, {"n": "e", "t": "pengusaha demi keberlanjutan serta kemajuan perusahaan. Mematuhi seluruh ketentuan tata tertib internal perusahaan serta seluruh peraturan pemerintah yang berlaku di wilayah"}, {"n": "f", "t": "Republik Indonesia. Bersedia melaksanakan kerja lembur di luar jam kerja normal apabila diperlukan dan ditugaskan oleh perusahaan guna"}, {"n": "g", "t": "penyelesaian pekerjaan yang mendesak atau sesuai tanggung jawabnya."}]}]}, {"h": "PASAL 3: LARANGAN - LARANGAN HUKUM", "it": [{"n": "1", "t": "Pihak Kedua dilarang melakukan tindakan-tindakan yang melanggar hukum dan ketentuan perusahaan sebagai berikut: Memberikan keterangan palsu atau data yang dipalsukan pada saat proses rekrutmen maupun selama masa kesepakatan", "sub": [{"n": "a", "t": "kerja berlangsung. Berada dalam keadaan mabuk, meminum minuman keras, atau menggunakan narkotika/psikotropika di lingkungan kerja"}, {"n": "b", "t": "maupun di lokasi lain yang berdampak pada kinerja di tempat kerja. Melakukan tindakan pencurian, penggelapan, penipuan, atau tindak kejahatan lainnya di dalam maupun di luar lingkungan"}, {"n": "c", "t": "perusahaan. Melakukan penganiayaan, penghinaan secara kasar, mengancam pengusaha, keluarga pengusaha, atau sesama rekan"}, {"n": "d", "t": "kerja, serta melakukan perkelahian di lingkungan kerja."}, {"n": "e", "t": "Melakukan tindakan yang bertentangan dengan hukum, norma kesusilaan, dan etika moral di lingkungan kerja. Dengan sengaja atau karena kecerobohannya merusak aset perusahaan atau membiarkan dirinya maupun rekan kerja"}, {"n": "f", "t": "berada dalam kondisi bahaya. Dengan sengaja membiarkan dirinya atau rekan kerja dalam keadaan bahaya meskipun telah diberikan peringatan"}, {"n": "g", "t": "sebelumnya. Membongkar, menyebarluaskan, atau menyalahgunakan rahasia perusahaan dan data konfidensial lainnya yang seharusnya"}, {"n": "h", "t": "dirahasiakan. Terbukti tidak cakap atau tidak mampu memenuhi standar performa minimal dalam menjalankan tugas dan tanggung jawab"}, {"n": "i", "t": "yang diberikan."}]}, {"n": "2", "t": "Pihak Kesatu dilarang melakukan tindakan-tindakan sebagai berikut: Melakukan penganiayaan, penghinaan secara kasar, atau mengancam Pihak Kedua, keluarga, serta anggota rumah tangga", "sub": [{"n": "a", "t": "Pihak Kedua, baik yang dilakukan langsung maupun melalui perantara. Membujuk Pihak Kedua, keluarga, atau rekan serumah Pihak Kedua untuk melakukan tindakan yang bertentangan dengan"}, {"n": "b", "t": "hukum, kesusilaan, atau peraturan perundang-undangan yang berlaku."}, {"n": "c", "t": "Terbukti tidak melakukan pembayaran upah/gaji kepada Pihak Kedua selama 2 (dua) bulan berturut-turut atau lebih."}, {"n": "d", "t": "Tidak memenuhi syarat-syarat atau melalaikan kewajiban yang telah ditetapkan dan disepakati dalam Kesepakatan Kerja ini. Tidak memberikan volume pekerjaan yang cukup bagi Pihak Kedua yang sistem penghasilannya didasarkan pada hasil kerja"}, {"n": "e", "t": "(borongan/satuan). Tidak menyediakan fasilitas atau sarana kerja yang dipersyaratkan bagi Pihak Kedua yang penghasilannya didasarkan pada"}, {"n": "f", "t": "hasil kerja, sehingga menghambat produktivitas. Membiarkan situasi yang dapat mengancam keselamatan jiwa atau kesehatan Pihak Kedua, di mana risiko tersebut tidak"}, {"n": "g", "t": "diinformasikan sebelumnya pada saat kesepakatan kerja diadakan. Memerintahkan Pihak Kedua untuk melakukan pekerjaan yang tidak layak secara norma atau tidak memiliki korelasi dengan"}, {"n": "h", "t": "ruang lingkup pekerjaan yang telah disepakati. Memaksa atau memerintahkan Pihak Kedua untuk bekerja pada perusahaan lain/pihak ketiga yang tidak sesuai dengan isi"}, {"n": "i", "t": "Kesepakatan Kerja, meskipun telah ditolak oleh Pihak Kedua."}]}]}, {"h": "PASAL 4: PERUBAHAN PERJANJIAN KERJA", "it": [{"n": "1", "t": "dilakukan berdasarkan kesepakatan bersama antara Pihak Kesatu dan Pihak Kedua. Perubahan sebagaimana dimaksud pada ayat (1) wajib dituangkan secara tertulis dalam suatu Addendum atau Perjanjian", "sub": []}, {"n": "2", "t": "Tambahan yang merupakan satu kesatuan yang tidak terpisahkan dari Perjanjian Kerja ini. Apabila terdapat perubahan peraturan perundang-undangan di bidang ketenagakerjaan yang bersifat wajib (mandatory), maka", "sub": []}, {"n": "3", "t": "para pihak sepakat untuk menyesuaikan isi perjanjian ini sesuai dengan ketentuan hukum yang berlaku.", "sub": []}]}, {"h": "PASAL 5: BERAKHIRNYA PERJANJIAN KERJA", "it": [{"n": "1", "t": "penghargaan masa kerja, apabila terjadi hal-hal sebagai berikut:", "sub": [{"n": "a", "t": "Masa berlaku perjanjian telah selesai sebagaimana diatur dalam Pasal 1 huruf (a)."}, {"n": "b", "t": "Pihak Kedua terbukti melakukan pelanggaran terhadap ketentuan Pasal 3 ayat (1) poin (a) sampai dengan (i)."}, {"n": "c", "t": "Pihak Kesatu melakukan tindakan yang melanggar ketentuan Pasal 3 ayat (2) poin (a) sampai dengan (i)."}, {"n": "d", "t": "Terjadinya situasi di luar kendali Pihak Kesatu yang menyebabkan aktivitas operasional tidak dapat dilanjutkan. Pekerjaan atau proyek yang ditugaskan kepada Pihak Kedua dinyatakan selesai, atau terhenti karena keadaan tertentu baik"}, {"n": "e", "t": "yang disebabkan oleh Pihak Kesatu maupun faktor eksternal lainnya. Pihak Kedua masih melakukan pelanggaran terhadap Peraturan Perusahaan (PP) atau Perjanjian Kerja Bersama (PKB) meskipun"}, {"n": "f", "t": "telah diberikan Surat Peringatan Ketiga (SP III) yang masih berlaku."}]}, {"n": "2", "t": "Pengakhiran Sebelum Waktunya: Apabila Pihak Kedua mengakhiri hubungan kerja sebelum masa berlaku PKWT berakhir bukan karena alasan yang dibenarkan oleh peraturan perundang-undangan, maka Pihak Kedua wajib membayar ganti rugi kepada Pihak Kesatu sebesar upah Pihak Kedua sampai batas waktu berakhirnya jangka waktu perjanjian.", "sub": []}]}, {"h": "PENUTUP", "it": [{"n": "1", "t": "dibubuhi meterai yang cukup sesuai dengan ketentuan berlaku, dan masing-masing pihak mendapatkan satu rangkap asli:", "sub": [{"n": "a", "t": "Rangkap I : Untuk Pihak Kedua (Karyawan)"}, {"n": "b", "t": "Rangkap II : Untuk Pihak Kesatu (Perusahaan) Perjanjian ini dibuat, disetujui, dan ditandatangani oleh kedua belah pihak dalam keadaan sehat jasmani maupun rohani, serta dilakukan"}]}, {"n": "2", "t": "secara sadar tanpa adanya unsur paksaan dari pihak manapun.", "sub": []}], "end": "Demikian Perjanjian Kerja ini dibuat untuk dipatuhi dan dilaksanakan sepenuhnya."}];
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],HR=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const dt=s=>s?new Date(s+'T00:00'):null,tgl=s=>{const t=dt(s);return t?`${t.getDate()} ${BLN[t.getMonth()]} ${t.getFullYear()}`:''};
const rng=s=>s?s.split(/\s*[–-]\s*/).join(' s/d '):'',rp=n=>n?'Rp '+Number(n).toLocaleString('id-ID'):'',fb=n=>String(n).replace('.',','),today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const V=(x,w=10)=>`<span class="v" style="min-width:${w}em">${esc(x)}</span>`,B=t=>esc(t).replace(/PIHAK (PERTAMA|KEDUA)/g,'<b>$&</b>');
const CB=(on,l)=>`<span class="cb ${on?'on':''}"><i></i>${l}</span>`,LI=(n,c)=>`<div class="li"><span>${n}</span><div>${c}</div></div>`,PS=h=>`<div class="ps"><i></i>${h}</div>`;
const T=(n,l,c)=>`<div class="t"><span class="n">${n}</span><span class="l">${l}</span><span class="c">${c}</span></div>`;
const X=(k,l,h,t='t',v='',w=0,o)=>({k,l,h,t,v,w,o});
const MAX=KRIT.reduce((a,k)=>a+Math.max(...k.lv.map(l=>l.b)),0);
const tot=d=>Math.round(KRIT.reduce((a,k,i)=>a+(d.k[i]>=0?k.lv[d.k[i]].b:0),0)*100)/100;

document.addEventListener('focusin',e=>{const t=e.target;if(t.tagName!='INPUT')return;if(t.getAttribute('list')){t.dataset.dl=t.getAttribute('list');t.removeAttribute('list')}if(t.dataset.dl){el=t;show()}});
document.addEventListener('input',e=>{if(e.target===el&&e.isTrusted)show()});
document.addEventListener('keydown',e=>{if(!box)return;if(e.key=='ArrowDown'||e.key=='ArrowUp'){ix=(ix+(e.key=='ArrowDown'?1:-1)+items.length)%items.length;[...box.children].forEach((c,i)=>c.classList.toggle('on',i==ix));e.preventDefault()}else if(e.key=='Enter'){pick(ix);e.preventDefault()}else if(e.key=='Escape')close()});
document.addEventListener('mousedown',e=>{const d=e.target.closest('.cbx div');if(d){pick(+d.dataset.i);e.preventDefault()}else if(e.target!==el)close()});
})();

boot();
</script></body></html>
