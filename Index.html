<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Digital Form</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== HRD PRO · liquid glass (layar) + dokumen A4 formal (cetak) ===== */
:root{--ink:#0d1a2f;--ink2:#2f4058;--mut:#61718a;--brand:#0c4594;--b2:#2a74f5;--cy:#2cc4e6;--amber:#ffb547;--ok:#0f8a5b;--bad:#c9352b;--line:#dfe6f0;
--glass:linear-gradient(145deg,#ffffff9e,#ffffff42);--rim:inset 0 1px 0 #fffffff2,inset 0 -1px 0 #ffffff47,inset 1px 0 0 #ffffff59,inset -1px 0 0 #ffffff33;
--drop:0 26px 50px -26px #0c2a5c73,0 4px 16px #0c2a5c14;--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}[hidden]{display:none!important}
html{background:#dbe7fa;scroll-behavior:smooth}
body{margin:0;display:flex;min-height:100vh;font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
/* latar: cahaya berwarna yang bergeser mengikuti kursor */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#e3eefd,#d6e6fb 55%,#e6f3f8)}
.bg i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.85;transform:translate(calc(var(--px,0)*var(--k)*1px),calc(var(--py,0)*var(--k)*1px));transition:transform .9s cubic-bezier(.2,.7,.2,1);animation:fl 28s ease-in-out infinite alternate}
.bg i:nth-child(1){--k:34;width:48vw;height:48vw;left:-10vw;top:-14vw;background:#2f7cf6}
.bg i:nth-child(2){--k:-26;width:42vw;height:42vw;right:-12vw;bottom:-14vw;background:#35c9e8;animation-delay:-9s}
.bg i:nth-child(3){--k:18;width:26vw;height:26vw;right:20vw;top:6vh;background:#ffbf5e;opacity:.5;animation-delay:-16s}
.bg i:nth-child(4){--k:-40;width:30vw;height:30vw;left:30vw;bottom:-10vw;background:#8b7cf6;opacity:.38;animation-delay:-5s}
@keyframes fl{to{translate:5vw 4vh;scale:1.12}}
/* material kaca: blur + saturasi, tepi terang, kilau mengikuti kursor */
.card,.st,.dock,.tabs,.tb{position:relative;background:radial-gradient(260px circle at var(--mx,-999px) var(--my,-999px),#ffffffb8,#fff0 62%),var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border:1px solid #ffffff99;box-shadow:var(--rim),var(--drop)}
.card::before,.st::before,.dock::before,.tabs::before,.tb::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:radial-gradient(200px circle at var(--mx,-999px) var(--my,-999px),#fff,#fff0 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@supports not (backdrop-filter:blur(1px)){.card,.st,.dock,.tabs,.tb{background:#ffffffeb}}
/* sidebar */
aside{width:280px;flex:none;margin:14px 0 14px 14px;height:calc(100vh - 28px);position:sticky;top:14px;overflow:auto;scrollbar-width:thin;padding:20px 14px;border-radius:28px;color:#d3e0f5;background:radial-gradient(320px circle at var(--mx,-999px) var(--my,-999px),#ffffff2e,#fff0 60%),linear-gradient(170deg,#0e4a9ec7,#071a3bc2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid #ffffff47;box-shadow:inset 0 1px 0 #ffffff66,inset 0 -1px 0 #ffffff1a,0 28px 56px -24px #0a1d3de6}
.brand{display:flex;flex-direction:column;gap:14px;margin:0 6px 16px;padding-bottom:16px;border-bottom:1px solid #ffffff24}
.lgplate{padding:8px 10px 2px;perspective:700px;cursor:default}.lgplate img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px #020c2a8c) drop-shadow(0 0 1px #ffffff40);transform:rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg));transition:transform .55s cubic-bezier(.2,.7,.2,1),filter .3s}.lgplate:hover img{filter:drop-shadow(0 14px 22px #020c2aa6) drop-shadow(0 0 10px #8fc0ff59)}
aside h1{font-size:16px;color:#fff;margin:0;line-height:1.2}aside small{display:block;color:#a9bddc;font-size:12px}
.srch{background:#ffffff1f;border:1px solid #ffffff33;color:#fff;box-shadow:none;margin-bottom:6px}.srch::placeholder{color:#a9bddc}.srch:hover,.srch:focus{background:#ffffff30;border-color:#ffffff99;box-shadow:0 0 0 3px #ffffff1f}
aside h3{font-size:12px;font-weight:600;color:#a9bddc;margin:18px 8px 6px}
aside nav button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:1px solid transparent;color:inherit;padding:9px 10px;border-radius:14px;cursor:pointer;font:inherit;transition:background .2s,transform .35s var(--spring),border-color .2s}
aside nav button:hover{background:#ffffff1f;transform:translateX(3px)}aside nav button:active{transform:scale(.98)}
aside nav button.on{color:#fff;background:linear-gradient(180deg,#ffffff3d,#ffffff17);border-color:#ffffff4d;box-shadow:inset 0 1px 0 #ffffff80,0 8px 18px -10px #020c22b3}aside nav b{min-width:58px;color:#ffd27a}
.menu{display:none;position:fixed;top:12px;left:12px;z-index:60;width:44px;height:44px;border-radius:15px;border:1px solid #ffffff8c;background:#0c4594cc;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;font-size:20px;box-shadow:inset 0 1px 0 #ffffff66}
.mlogo{display:none}
/* halaman */
main{flex:1;min-width:0;max-width:1160px;margin:0 auto;padding:34px clamp(16px,3vw,38px)}
.top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap;margin-bottom:22px}
.top h2{margin:10px 0 4px;font-size:clamp(25px,3vw,34px);letter-spacing:-.045em;line-height:1.12}
.code{display:inline-block;font-weight:700;font-size:12px;color:var(--brand);padding:4px 12px;border-radius:999px;background:linear-gradient(180deg,#ffffffd9,#ffffff73);border:1px solid #ffffffb3;box-shadow:inset 0 1px 0 #fff,0 6px 14px -8px #0c2a5c66}
.mut{color:var(--mut);margin:0}
.tabs{display:flex;gap:4px;padding:4px;border-radius:16px}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:12px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;transition:background .25s,color .25s,transform .35s var(--spring)}.tabs button:active{transform:scale(.95)}
.tabs .on{background:linear-gradient(180deg,#fffffff2,#ffffffb3);color:var(--brand);box-shadow:inset 0 1px 0 #fff,0 6px 14px -6px #0c2a5c80}
.secs{display:grid;gap:16px}.card{padding:clamp(18px,2.6vw,30px);border-radius:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px 22px}.full{grid-column:1/-1}
.grid h3{grid-column:1/-1;margin:0;font-size:15px;padding:2px 0 2px 13px;border-left:4px solid var(--amber);border-radius:2px;letter-spacing:-.01em;color:#123e7c}.grid h4{grid-column:1/-1;margin:8px 0 0;color:var(--brand)}
.fld{display:grid;gap:7px;align-content:start}.fld span{font-weight:600;font-size:12.5px;color:var(--ink2)}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:11px 14px;color:inherit;border:1px solid #ffffffcc;border-radius:15px;background:#ffffff73;box-shadow:inset 0 1px 3px #0c2a5c26,inset 0 -1px 0 #ffffff99;transition:background .2s,box-shadow .25s,transform .35s var(--spring)}
input:hover,select:hover,textarea:hover{background:#ffffffb3}
input:focus,select:focus,textarea:focus{outline:0;background:#ffffffe6;box-shadow:inset 0 1px 2px #0c2a5c14,0 0 0 2px var(--b2),0 0 0 7px #2a74f52e,0 10px 24px -12px #2a74f599}
.seg{display:flex;flex-wrap:wrap;gap:8px}.pill{position:relative}.pill input{position:absolute;opacity:0;width:0;height:0;min-height:0}
.pill span{display:block;padding:9px 16px;border:1px solid #ffffffcc;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;background:linear-gradient(180deg,#ffffffa6,#ffffff59);box-shadow:inset 0 1px 0 #fff,0 4px 10px -6px #0c2a5c66;transition:transform .35s var(--spring),background .2s,color .2s,box-shadow .2s}
.pill span:hover{background:#ffffffe6;color:var(--brand);transform:translateY(-2px)}.pill:active span{transform:scale(.94)}
.pill input:checked+span{background:linear-gradient(180deg,#5b9cff,#1550b4);color:#fff;border-color:#ffffff8c;box-shadow:inset 0 1px 0 #ffffffa6,0 10px 20px -8px #0c4594d9}.pill input:checked+span::before{content:'✓ '}
.pill input:focus-visible+span{outline:2px solid var(--b2);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 12px;border-bottom:1px dashed #0c2a5c24;border-radius:14px;transition:background .2s}.row:hover{background:#ffffff80}.row>span{font-weight:500}
.dock{position:sticky;bottom:14px;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px;padding:11px 16px;border-radius:24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.pg{position:relative;width:170px;height:32px;border-radius:999px;background:#ffffff66;overflow:hidden;font-size:12px;font-weight:700;color:var(--brand);display:grid;place-items:center;box-shadow:inset 0 1px 3px #0c2a5c2e,inset 0 -1px 0 #ffffffa6}
.pg i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#9fc4fb,#4b93f7);box-shadow:inset 0 1px 0 #ffffffa6;transition:width .5s var(--spring)}.pg span{position:relative}
.chip{background:linear-gradient(180deg,#ffffffbf,#ffffff66);border:1px solid #ffffffb3;padding:5px 12px;border-radius:999px;font-size:13px;box-shadow:inset 0 1px 0 #fff}.chip.ok{background:#d5f5e6;color:var(--ok)}.chip.bad{background:#fde1de;color:var(--bad)}
.btn{position:relative;overflow:hidden;font:inherit;font-weight:600;padding:11px 20px;border-radius:15px;border:1px solid #ffffffcc;cursor:pointer;color:var(--ink);background:radial-gradient(120px circle at var(--mx,-999px) var(--my,-999px),#ffffffe6,#fff0 70%),linear-gradient(180deg,#ffffffb8,#ffffff66);box-shadow:inset 0 1px 0 #fff,0 8px 18px -10px #0c2a5c80;transition:transform .35s var(--spring),box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 #fff,0 14px 24px -12px #0c2a5c99}.btn:active{transform:scale(.96)}
.btn.p{color:#fff;border-color:#ffffff80;background:radial-gradient(120px circle at var(--mx,-999px) var(--my,-999px),#ffffff59,#fff0 70%),linear-gradient(180deg,#5b9cff,#1550b4);box-shadow:inset 0 1px 0 #ffffffb3,0 12px 24px -10px #0c4594e6}
.btn.s{padding:6px 12px;font-size:12px;border-radius:12px}.btn.d{color:var(--bad)}.btn:disabled{opacity:.6;cursor:wait}.act{display:flex;gap:10px;flex-wrap:wrap}
.btn.busy::after{content:'';display:inline-block;width:12px;height:12px;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.scroll{overflow-x:auto}.ed{border-collapse:collapse;width:100%;min-width:600px;margin-bottom:8px}.ed th{text-align:left;font-size:12px;color:var(--mut);padding:8px 6px;font-weight:600}
.ed td{padding:5px 4px;border-top:1px solid #ffffffb3}.ed td input,.ed td select{padding:8px 10px;min-width:96px;min-height:40px}
.x{border:0;background:none;font-size:20px;color:var(--bad);cursor:pointer;border-radius:10px;transition:background .2s,transform .35s var(--spring)}.x:hover{background:#fde1de;transform:scale(1.15)}
.hist td{padding:12px 8px;vertical-align:top}.hist tbody tr{transition:background .2s}.hist tbody tr:hover td{background:#ffffff80}.rn{display:block;color:var(--brand);font-weight:600;font-size:11.5px}.ops{white-space:nowrap}.ops .btn{margin-right:4px}.empty{text-align:center;padding:48px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}.st{border-radius:22px;padding:16px 22px;display:grid}.st b{font-size:25px;letter-spacing:-.02em;color:var(--brand)}.st span{color:var(--mut);font-size:12.5px}
.tools{display:flex;gap:10px;margin-bottom:16px}.tools input{flex:1}
#toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,24px) scale(.96);background:#0d1a2fd9;-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);color:#fff;padding:12px 22px;border-radius:18px;border:1px solid #ffffff3d;opacity:0;pointer-events:none;transition:opacity .25s,transform .45s var(--spring);z-index:99;box-shadow:inset 0 1px 0 #ffffff4d,0 20px 40px -14px #0d1a2fb3}
#toast::before{content:'✓';color:#5ee0a0;font-weight:800;margin-right:9px}#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#b3261ee6}#toast.bad::before{content:'!';color:#fff}
/* pratinjau dokumen */
#ov{position:fixed;inset:0;z-index:50;overflow:auto;padding:0 12px 40px;background:#0b1d42ad;-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}
.tb{position:sticky;top:12px;z-index:6;display:flex;gap:8px;width:max-content;max-width:100%;margin:12px auto 18px;padding:6px;border-radius:20px}

/* ===== DOKUMEN (dipakai layar & cetak) ===== */
.paper{--pk:#0f172a;--pm:#66758c;--pl:#dde5ef;--pb:#0e3a7a;--pa:#1f5eff;--pt:#12a594;--ps:#f5f8fd;
 position:relative;display:flex;flex-direction:column;width:210mm;max-width:100%;min-height:297mm;margin:0 auto;padding:0 16mm 14mm;background:#fff;color:var(--pk);border-radius:14px;font-size:12px;line-height:1.5;box-shadow:0 34px 80px -26px #050f28b3,0 0 0 1px #ffffff66}
.paper>*{flex:none}
.paper .band{height:1.6mm;margin:12mm 0 7mm;border-radius:2px;background:linear-gradient(90deg,var(--pb),var(--pa) 62%,var(--pt))}
.lh{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:6mm;border-bottom:1px solid var(--pl)}
.org{display:flex;align-items:center;gap:4mm}.rlogo{display:block;height:13mm;width:auto;max-width:62mm;object-fit:contain}.org small{max-width:50mm;padding:1mm 0 1mm 4mm;border-left:1px solid var(--pl);font-size:9.5px;line-height:1.45;color:var(--pm)}
.dk{display:grid;justify-items:end;gap:3px;text-align:right}.dk small{font-size:9px;font-weight:600;color:var(--pm)}.dk b{font-size:13px;color:var(--pb);word-break:break-all}
.secure-tag{padding:2px 9px;border-radius:99px;background:#e0f6f2;color:#0b7f71;font-size:8.5px;font-weight:700}
.ttl{margin:8mm 0 0}.doc-kicker{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--pa)}.doc-kicker::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--pt)}
.fid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 5mm;align-items:center;margin-bottom:5mm}
.ttl h1{grid-column:1/4;min-width:0;margin:0;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.fno{grid-column:4;margin:0;display:flex;gap:7mm}
.fno dt{font-size:9px;color:var(--pm)}.fno dd{margin:1px 0 0;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--pb)}
.meta{margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:3mm 5mm;padding:4mm 0;border-top:1px solid var(--pl);border-bottom:1px solid var(--pl)}
.meta dt{font-size:9px;color:var(--pm)}.meta dd{margin:1px 0 0;font-size:11.5px;font-weight:700;overflow-wrap:anywhere}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:7mm;margin-top:6mm;padding:4mm 6mm;background:var(--ps);border-radius:3mm}
.rg{display:grid;justify-items:center;gap:5px;font-size:10.5px;font-weight:600}
.ring{position:relative;width:21mm;height:21mm;border-radius:50%;display:grid;place-content:center;text-align:center;background:conic-gradient(var(--pa) calc(var(--p)*1%),#dbe5f6 0)}.ring::before{content:'';position:absolute;inset:2mm;border-radius:50%;background:#fff}
.ring b,.ring small{position:relative;line-height:1.1}.ring b{font-size:18px;color:var(--pb)}.ring small{font-size:9px;color:var(--pm)}
.vd{display:grid;padding:8px 18px;border-radius:99px;background:#fff;font-weight:800;font-size:13px;box-shadow:inset 0 0 0 1.5px currentColor}.vd small{font-weight:500;font-size:9.5px;color:var(--pm)}.vd.ok{color:var(--ok)}.vd.bad{color:var(--bad)}
.paper h3{display:flex;align-items:center;gap:3mm;margin:7mm 0 3mm;font-size:12px;font-weight:800;color:var(--pb);line-height:1.2}.paper h3::after{content:'';flex:1;height:1px;background:var(--pl)}
.paper h4{margin:5mm 0 2mm;font-size:11px;font-weight:700;color:var(--pm)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:0 6mm;margin:2mm 0 0}.kv>div{padding:2.4mm 0;border-bottom:1px solid var(--pl)}.kv .w{grid-column:1/-1}
.kv dt{font-size:9px;color:var(--pm)}.kv dd{margin:1px 0 0;font-size:12px;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.sr{display:grid;grid-template-columns:1fr 38mm 28mm;gap:4mm;align-items:center;padding:2.2mm 0;border-bottom:1px solid var(--pl);font-size:11.5px}.sr b{text-align:right}
.mt{height:5px;background:#e6edf8;border-radius:9px;overflow:hidden}.mt i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pa),var(--pt))}
.rt{width:100%;margin-top:3mm;border-collapse:collapse;font-size:10.5px}
.rt th{padding:2.6mm 2.2mm;text-align:left;vertical-align:bottom;font-size:9px;font-weight:800;line-height:1.3;color:var(--pb);background:var(--ps);border-top:1.5px solid var(--pb);border-bottom:1px solid #c9d6ea}
.rt td{padding:3.2mm 2.2mm;vertical-align:top;border-bottom:1px solid var(--pl);overflow-wrap:break-word}.rt td:first-child{font-weight:600}.rt .n{text-align:right;font-variant-numeric:tabular-nums}
.tt{display:flex;justify-content:space-between;align-items:center;padding:3.2mm 2.2mm;background:var(--ps);border-bottom:1.5px solid var(--pb);font-weight:700;color:var(--pb)}.tt b{font-size:14px;color:var(--pa)}
.close{margin-top:auto;padding-top:10mm}
.sig{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4mm}
.sig>div{display:flex;flex-direction:column;align-items:center;text-align:center;padding:3.5mm 3mm 3mm;border:1px solid var(--pl);border-radius:3mm;background:#fff}
.sig p{margin:0;font-size:9.5px;font-weight:800;color:var(--pa)}
.sq{width:100%;height:25mm;margin:2mm 0 2.5mm;display:grid;place-items:center}.sq i{display:block;width:88%;align-self:end;margin-bottom:2mm;border-bottom:1px dotted #8b9ab0}
.sq img,.sq canvas{width:22mm!important;height:22mm!important;image-rendering:pixelated}
.sn{display:block;font-size:11px;font-weight:800;overflow-wrap:anywhere}.sig small{margin-top:1px;font-size:8.5px;color:var(--pm)}
.vf{display:flex;align-items:center;gap:5mm;margin-top:6mm;padding:4mm 5mm;background:var(--ps);border:1px solid var(--pl);border-left:3px solid var(--pt);border-radius:3mm}
.vf #qr{flex:none;width:24mm;height:24mm;padding:1.2mm;display:grid;place-items:center;background:#fff;border:1px solid var(--pl);border-radius:2mm;line-height:0}
.vf #qr img,.vf #qr canvas{width:21.6mm!important;height:21.6mm!important;image-rendering:pixelated}.vf #qr:empty{display:none}
.verify-copy{display:grid;gap:2px;min-width:0}.verify-copy b{font-size:10.5px;color:var(--pb)}.verify-copy p{margin:0;font-size:9.5px;color:#43536b}
.verify-no{font:700 10px/1.4 ui-monospace,Consolas,monospace;color:#173e78;overflow-wrap:anywhere}.verify-copy small{font-size:8.5px;color:var(--pm);overflow-wrap:anywhere}

/* ===== RESPONSIF (hanya layar, supaya cetak A4 selalu memakai layout desktop) ===== */
@media screen and (max-width:820px){
 body{display:block}.menu{display:block}
 aside{position:fixed;z-index:55;inset:0 auto 0 0;width:84%;max-width:310px;height:100vh;margin:0;border-radius:0 28px 28px 0;transform:translateX(-105%);transition:transform .3s var(--spring)}aside.open{transform:none;box-shadow:0 0 0 100vmax #0d1a2f88}
 main{padding:74px 14px 18px}.card{padding:18px;border-radius:22px}.dock{bottom:8px;border-radius:20px}.pg{width:100%}.tools{flex-direction:column}
 .mlogo{display:block;position:fixed;top:12px;left:64px;height:44px;width:auto;z-index:59;padding:6px 12px;background:linear-gradient(145deg,#ffffffb8,#ffffff66);border:1px solid #ffffffb3;border-radius:16px;-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);box-shadow:inset 0 1px 0 #fff,0 10px 22px -12px #0c2a5c80}#sb.open~.mlogo{display:none}
}
@media screen and (max-width:700px){
 .paper{padding:0 18px 18px;border-radius:12px}.fid{display:flex;flex-direction:column;align-items:flex-start;gap:4mm}.ttl h1{font-size:22px}.lh{flex-direction:column;align-items:flex-start}.dk{justify-items:start;text-align:left}.org{flex-direction:column;align-items:flex-start}

@page{size:A4 portrait;margin:0}

 html,body{display:block;min-height:0;height:auto;background:#fff!important}

/* === TAMPILAN FORM: lebih terang & jelas === */
.bg i{animation:none;opacity:.35}
.card{background:#ffffffe8;-webkit-backdrop-filter:none;backdrop-filter:none}
input,select,textarea{background:#fff;border:1px solid #b9cbe6;box-shadow:none;border-radius:12px}
input:hover,select:hover,textarea:hover{background:#f5f9ff}
.fld span{font-size:13px;color:#0f2a52}.grid{gap:16px 20px}
/* === LAPORAN CETAK: elegan, modern, profesional === */
.paper{--pb:#0b2f66;--pa:#1b57d6;--pt:#0f9d8a;--ps:#f4f7fc;--pl:#d9e2ee;color:#0f172a}
.paper .band{height:2.2mm;border-radius:0;margin:0 0 6mm;background:linear-gradient(90deg,var(--pb) 0 58%,var(--pa) 58% 84%,var(--pt) 84%)}
.lh{border-bottom:.35mm solid var(--pb);padding-bottom:5mm}.ttl{margin-top:7mm}
.doc-kicker{grid-column:1/-1;margin-bottom:2mm;text-transform:uppercase;letter-spacing:.14em;font-size:8.5px}
.ttl h1{font-size:25px;letter-spacing:-.02em}.fno{padding-left:5mm;border-left:.3mm solid var(--pl)}
.meta{background:var(--ps);padding:3.5mm 4mm;border:0;border-radius:2mm;border-left:1mm solid var(--pa)}
.paper h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;margin:8mm 0 3mm;padding:1.6mm 3mm;background:var(--ps);border-left:1mm solid var(--pb);border-radius:0 1.5mm 1.5mm 0;break-after:avoid}.paper h3::after{display:none}
.kv dt{text-transform:uppercase;letter-spacing:.06em;font-size:7.5px}.kv dd{font-size:11.5px}
.rt th{background:var(--pb);color:#fff;border:0;text-transform:uppercase;letter-spacing:.04em;font-size:8px}
.rt tbody tr:nth-child(even) td{background:#f7f9fd}.rt tr,.sr,.sig>div,.vf,.kv>div{break-inside:avoid}
.tt{background:var(--ps);border-bottom:.4mm solid var(--pb)}
.sig>div{border:.25mm solid var(--pl);border-top:1mm solid var(--pb);border-radius:0 0 2mm 2mm}
.sig p{text-transform:uppercase;letter-spacing:.06em;font-size:8px;color:var(--pb)}
.vf{border:.3mm solid var(--pl);border-left:1.2mm solid var(--pt);background:#fff}
.vf #qr{width:30mm;height:30mm;padding:1.5mm;border:.3mm solid var(--pb)}.vf #qr img,.vf #qr canvas{width:27mm!important;height:27mm!important}
.fn{margin:4mm 0 0;padding-top:2.5mm;border-top:.2mm solid var(--pl);font-size:8px;color:var(--pm);text-align:center}
